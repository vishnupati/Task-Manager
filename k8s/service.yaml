apiVersion: v1
kind: Service
metadata:
  name: task-manager
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-manager
    app.kubernetes.io/component: web
spec:
  # ClusterIP keeps the service internal to the cluster.
  # The Ingress (ingress.yaml) is the single public entry point and
  # distributes traffic across all healthy pods (load balancing).
  type: ClusterIP

  selector:
    app: task-manager

  ports:
    - name: http
      protocol: TCP
      port: 80 # port exposed inside the cluster
      targetPort: http # maps to containerPort named "http" (4000)

  # sessionAffinity: None distributes each request independently (round-robin).
  # Set to "ClientIP" only if you need sticky sessions.
  sessionAffinity: None
